# ==========================================================
# Hexo 主题 Fluid 配置文件
# 详细说明：https://hexo.fluid-dev.com/docs/guide/
# 注意：键名不能改动，只能修改冒号后面的值
# ==========================================================


# ==========================================================
# 全局
# ==========================================================

# 浏览器标签页图标
favicon: /img/favicon.png

# 苹果设备图标
apple_touch_icon: /img/favicon.png

# 浏览器标签页标题分隔符，效果：文章名 - 站点名
tab_title_separator: " - "

# 强制所有链接升级为 HTTPS（用于解决 HTTP 资源混入报错）
force_https: false

# 代码块增强配置
code:
  # 代码块复制按钮
  copy_btn: true

  # 代码语言标签
  language:
    enable: true
    default: "TEXT"

  # 代码高亮
  highlight:
    enable: true

    # 是否显示行号
    line_number: true

    # 高亮库：highlightjs | prismjs
    lib: "highlightjs"

    highlightjs:
      # 高亮风格，可选样式见 https://highlightjs.org/demo/
      style: "github gist"
      style_dark: "dark"

    prismjs:
      # 高亮风格，可选样式见 https://prismjs.com/
      style: "default"
      style_dark: "tomorrow night"

      # true 为生成时静态高亮（不支持部分 prismjs 插件），false 为浏览器端 JS 生成
      preprocess: true

# 趣味功能
fun_features:
  # 副标题打字机效果
  typing:
    enable: true

    # 打印速度，数字越大越慢
    typeSpeed: 70

    # 游标字符
    cursorChar: "_"

    # 是否循环播放
    loop: false

    # 仅在指定页面开启，不填则全站开启
    # 可选：home | post | tag | category | about | links | page | 404
    scope: []

  # 文章标题锚点图标
  anchorjs:
    enable: true
    element: h1,h2,h3,h4,h5,h6

    # 图标位置：left | right
    placement: left

    # 显示方式：hover（悬停）| always（始终）
    visible: hover

    # 图标字符，可选：§ | # | ❡
    icon: ""

  # 页面加载进度条
  progressbar:
    enable: true
    height_px: 3
    color: "#29d"
    options: { showSpinner: false, trickleSpeed: 100 }

# 暗色模式，开启后菜单出现切换按钮，访客的选择会保存在其浏览器中
dark_mode:
  enable: true

  # 默认模式；auto 优先跟随系统偏好，其次 18 点至次日 6 点自动进入暗色
  # 可选：auto | light | dark
  default: auto

# 主题配色（其余颜色请用自定义 CSS 处理，配色参考 https://www.webdesignrankings.com/resources/lolcolors/）
color:
  body_bg_color: "#eee"                # body 背景色
  body_bg_color_dark: "#181c27"        # 暗色模式的 body 背景色
  navbar_bg_color: "#2f4154"           # 顶部菜单背景色
  navbar_bg_color_dark: "#1f3144"
  navbar_text_color: "#fff"            # 顶部菜单字体色
  navbar_text_color_dark: "#d0d0d0"
  subtitle_color: "#fff"               # 副标题字体色
  subtitle_color_dark: "#d0d0d0"
  text_color: "#3c4858"                # 全局字体色
  text_color_dark: "#c4c6c9"
  sec_text_color: "#718096"            # 次级字体色（摘要、简介等）
  sec_text_color_dark: "#a7a9ad"
  board_color: "#fff"                  # 主面板背景色
  board_color_dark: "#252d38"
  post_text_color: "#2c3e50"           # 文章正文字体色
  post_text_color_dark: "#c4c6c9"
  post_heading_color: "#1a202c"        # 文章标题字体色（h1~h6）
  post_heading_color_dark: "#c4c6c9"
  post_link_color: "#0366d6"           # 文章超链接字体色
  post_link_color_dark: "#1589e9"
  link_hover_color: "#30a9de"          # 超链接悬浮字体色
  link_hover_color_dark: "#30a9de"
  link_hover_bg_color: "#f8f9fa"       # 超链接悬浮背景色
  link_hover_bg_color_dark: "#364151"
  line_color: "#eaecef"                # 分隔线和表格边线颜色
  line_color_dark: "#435266"
  scrollbar_color: "#c4c6c9"           # 滚动条颜色
  scrollbar_color_dark: "#687582"
  scrollbar_hover_color: "#a6a6a6"     # 滚动条悬浮颜色
  scrollbar_hover_color_dark: "#9da8b3"
  button_bg_color: "transparent"       # 按钮背景色
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "#f2f3f5"     # 按钮悬浮背景色
  button_hover_bg_color_dark: "#46647e"

# 字体
font:
  font_size: 16px
  font_family:
  letter_spacing: 0.02em
  code_font_size: 85%

# 自定义 js 文件路径，相对 source 目录，如 /js/custom.js 对应 source/js/custom.js
custom_js:

# 自定义 css 文件路径，用法同上
custom_css:

# 网页访问统计
web_analytics:
  enable: false

  # 遵循访客浏览器"请勿追踪"设置，开启则不统计此类访客
  follow_dnt: true

  # 百度统计 Key（hm.js? 后的字符串），见 https://tongji.baidu.com
  baidu:

  # Google Analytics 4 的媒体资源 ID（MEASUREMENT_ID）
  google:
    measurement_id:

  # 腾讯统计 H5 App ID（开启高级功能才有 cid）
  tencent:
    sid:
    cid:

  # LeanCloud 计数，可用于 PV/UV 展示；未开启 web_analytics 时只查询不计数
  leancloud:
    app_id:
    app_key:
    server_url:      # REST API 服务器地址，国际版不填
    path: window.location.pathname
    ignore_local: false

  # OpenKounter 计数（基于 EdgeOne Pages），可用于 PV/UV 展示，见 https://github.com/Mintimate/open-kounter
  openkounter:
    server_url: https://open-kounter.mintimate.cn
    path: window.location.pathname
    ignore_local: false

  # Umami 统计（仅支持自部署）；要展示 PV/UV 需填全部配置，否则只填 src 和 website_id，见 https://umami.is/docs
  umami:
    src:             # umami js 文件地址，在 umami 后台创建站点后获取
    website_id:      # umami 的 website id
    domains:         # 仅统计指定域名，多个用英文逗号分隔（可避免统计 localhost）
    start_time: 2024-01-01   # PV/UV 统计开始时间，格式 "YYYY-MM-DD"
    token:           # umami 只读用户的 token（通过 login api 获取）
    api_server:      # umami 部署的服务器地址，如 "https://umami.example.com"

# Canonical，向搜索引擎指定规范网址；开启前需在 hexo 配置中正确设置 url
canonical:
  enable: false

# 图片和评论插件懒加载，可见范围外的元素不提前加载
lazyload:
  enable: true
  loading_img: /img/loading.gif

  # 开启后仅文章页生效；自定义页面可在 Front-matter 指定 `lazyload: true`
  onlypost: false

  # 触发加载的偏移倍数（基数是视窗高度），可按部署环境网速调节
  offset_factor: 2

# 图标库（含大量社交图标，主题依赖的图标不在此内），详见 https://hexo.fluid-dev.com/docs/icon/
iconfont: //at.alicdn.com/t/c/font_1736178_k526ubmyhba.css


# ==========================================================
# 页头
# ==========================================================

# 导航栏
navbar:
  # 导航栏左侧标题，为空则显示 hexo 配置中的 title
  blog_title: "走线之间"

  # 毛玻璃特效（实验性功能，可能造成滚动掉帧，不支持的浏览器自动失效）
  ground_glass:
    enable: false
    px: 3          # 模糊像素，越大越模糊
    alpha: 0.7     # 不透明度 0~1.0，过大可能看不清菜单字体

  # 导航栏菜单：key 关联语言文件（无关联则显示 key 本身），icon 为 css class，可加 name 强制显示指定名称
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }
    #- { key: "links", link: "/links/", icon: "iconfont icon-link-fill" }

# 本地搜索，基于 hexo-generator-search 插件；已装其他搜索插件请关闭，避免生成多余索引
search:
  enable: true
  path: /local-search.xml          # 搜索索引文件路径
  generate_path: /local-search.xml # 索引文件本地生成位置
  field: post                      # 搜索范围：post | page | all
  content: true                    # 是否扫描正文

# 首屏大图
banner:
  # 全站随机头图，仅在页面 banner_img 为空时生效，图片放在 source/img/random/ 目录
  random_img: false
  parallax: true       # 视差滚动
  width_height_ratio: 1.0   # 图片最小宽高比，避免移动端过度裁剪，0 为关闭

# 向下滚动箭头
scroll_down_arrow:
  enable: true
  banner_height_limit: 80      # 头图高度不小于该比例才显示箭头（0~100）
  scroll_after_turning_page: true   # 翻页后自动滚动

# 回到顶部箭头
scroll_top_arrow:
  enable: true

# Open Graph 元数据
open_graph:
  enable: true
  twitter_card: summary_large_image
  twitter_id:
  twitter_site:
  google_plus:
  fb_admins:
  fb_app_id:


# ==========================================================
# 页脚
# ==========================================================

footer:
  # 页脚第一行文字（HTML），建议保留 Fluid 链接以推广主题
  content: '
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '

  # 网站 PV/UV 统计展示
  statistics:
    enable: false
    # 数据来源：busuanzi | leancloud | umami | openkounter
    # leancloud/umami/openkounter 需在 web_analytics 中配置对应参数；busuanzi 本地显示数值偏大属正常
    source: "busuanzi"

  # 国内大陆服务器备案信息，其他地区保持关闭
  beian:
    enable: false
    icp_text: 京ICP证123456号        # ICP 证号
    police_text: 京公网安备12345678号 # 公安备案号，不填则只显示 ICP
    police_code: 12345678            # 公安备案编号，用于跳转查询
    police_icon: /img/police_beian.png  # 公安备案图片，为空则不显示


# ==========================================================
# 首页
# ==========================================================

index:
  banner_img: /img/banner.jpg
  banner_img_height: 100    # 头图高度（屏幕百分比 0~100）
  banner_mask_alpha: 0.3    # 头图黑色蒙版不透明度（0~1.0）

  # 首页副标题
  slogan:
    enable: true

    # 为空则显示 hexo 配置中的 subtitle；支持列表格式随机显示一行
    text: "纸上得来终觉浅，绝知此事要躬行"

    # 通过 API 接口获取副标题内容，必须返回 JSON；失败时按 text 显示，需先开启打字机功能
    api:
      enable: false
      url: ""
      method: "GET"    # 请求方法：GET | POST | PUT
      headers: {}
      # 从返回结果取字符串的字段路径，如返回 {"data":{"content":"xxx"}} 则填 ['data','content']；列表自动取第一项
      keys: []

  # 自动截取文章摘要
  auto_excerpt:
    enable: true

  # 打开文章的标签页方式：_blank | _self
  post_url_target: _self

  # 是否显示文章信息（时间、分类、标签）
  post_meta:
    date: true
    category: true
    tag: true

  # 置顶文章（按 sticky 排序）标题前显示的图标
  post_sticky:
    enable: true
    icon: "iconfont icon-top"


# ==========================================================
# 文章页
# ==========================================================

post:
  banner_img: /img/banner.jpg
  banner_img_height: 70
  banner_mask_alpha: 0.3

  # 文章在首页的默认封面图，未指定 index_img 时使用；两项都为空则不显示封面
  default_index_img:

  # 文章标题下方的元信息
  meta:
    # 作者，优先取 front-matter 的 author，其次 hexo 配置中的 author
    author:
      enable: false

    # 发布日期，优先取 front-matter 的 date，其次 md 文件日期
    date:
      enable: true
      format: "LL a"   # ISO-8601 日期格式化，见 http://momentjs.cn/docs/#/parsing/string-format/

    # 字数统计
    wordcount:
      enable: true

    # 预计阅读时长
    min2read:
      enable: true
      awl: 2      # 每个字词的平均长度：中文≈2，英文≈5，中英混合可自行调节
      wpm: 60     # 每分钟阅读字数，技术文章可适度调低

    # 浏览量计数
    views:
      enable: false
      source: "busuanzi"   # 数据来源：busuanzi | leancloud | umami

  # 文章开头显示更新时间，默认取 md 文件更新时间，可用 front-matter 的 updated 手动指定
  updated:
    enable: false
    date_format: "LL a"
    relative: false      # true 则用相对时间，如"3 天前"
    note_class: info     # 提示标签类型：default | primary | info | success | warning | danger | light

  # 侧边栏展示当前分类下的文章
  category_bar:
    enable: true

    # true 时需在文章 Front-matter 指定 `category_bar: true` 才展示，也可用 `category_bar: ["分类A"]` 指定分类
    specific: true

    # 位置：left | right
    placement: left

    # 文章排序字段，减号开头为倒序
    post_order_by: "title"

    # 单个分类折叠展示的文章数上限，超出显示 More，0 不限制
    post_limit: 0

  # 侧边栏文章目录
  toc:
    enable: true
    expand_all: true     # 进入文章时是否展开全部目录
    placement: right     # 位置：left | right
    headingSelector: "h1,h2,h3,h4,h5,h6"   # 作为目录标题的节点
    collapseDepth: 0     # 折叠深度，0 全部折叠；大于 0 且有下级标题时默认展开

  # 版权声明，显示在每篇文章结尾
  copyright:
    enable: true
    # CreativeCommons 许可协议：BY | BY-SA | BY-ND | BY-NC | BY-NC-SA | BY-NC-ND | ZERO
    # 见 https://creativecommons.org/share-your-work/cclicenses/
    license: 'BY'
    author:
      enable: true       # 显示作者
    post_date:
      enable: true       # 显示发布日期
      format: "LL"
    update_date:
      enable: false      # 显示更新日期
      format: "LL"

  # 文章底部上一篇 / 下一篇
  prev_next:
    enable: true

  # 文章图片标题
  image_caption:
    enable: true

  # 文章图片点击放大
  image_zoom:
    enable: true
    # 放大时图片链接替换规则，如 ['-slim',''] 表示把链接中的 -slim 移除；正则需加 re: 前缀
    img_url_replace: ['', '']

  # 脚注语法，在文章底部生成脚注；若 Markdown 渲染器本身支持建议关闭以免冲突
  footnote:
    enable: true
    # 脚注节标题，可在 front-matter 中用 `footnote: <h2>Reference</h2>` 单独修改
    header: ''

  # 数学公式：开启前需更换 Markdown 渲染器，见 https://hexo.fluid-dev.com/docs/guide/##latex-数学公式
  math:
    enable: false
    # true 时需在文章 Front-matter 指定 `math: true` 才启用，页面无公式时加载更快
    specific: false
    engine: mathjax    # 可选：mathjax | katex

  # mermaid 流程图，见 https://hexo.fluid-dev.com/docs/guide/#mermaid-流程图
  mermaid:
    enable: false
    specific: false    # 用法同 math 的 specific
    options: { theme: 'default' }

  # 评论插件：需先在这里开启，再按 type 配置下方对应插件参数
  comments:
    enable: false
    # 可选：utterances | disqus | gitalk | valine | waline | changyan | livere | remark42 | twikoo | cusdis | giscus | discuss
    type: disqus


# ==========================================================
# 评论插件参数（按上方 comments.type 只需配置对应的一个）
# ==========================================================

# Utterances，基于 GitHub Issues，见 https://utteranc.es
utterances:
  repo:
  issue_term: pathname
  label: utterances
  theme: github-light
  theme_dark: github-dark

# Disqus，第三方服务，国内访问易被墙，建议配合 Disqusjs 使用
disqus:
  shortname:
  # 以下为 Disqusjs 配置，支持多个 apikey，建议自建 api 端点，见 https://github.com/SukkaW/DisqusJS
  disqusjs: false
  apikey:
    - 'KEY1'
    #- 'KEY2'
  api: https://disqus.skk.moe/disqus/
  admin:
  adminLabel:

# Gitalk，基于 GitHub Issues，见 https://github.com/gitalk/gitalk#options
gitalk:
  clientID:
  clientSecret:
  repo:
  owner:
  admin: ['name']
  language: zh-CN
  labels: ['Gitalk']
  perPage: 10
  pagerDirection: last
  distractionFreeMode: false
  createIssueManually: true
  # 默认代理可能失效，解决方法见：
  # https://github.com/gitalk/gitalk/issues/429
  # https://github.com/Zibri/cloudflare-cors-anywhere
  proxy: https://cors-anywhere.azm.workers.dev/https://github.com/login/oauth/access_token

# Valine，基于 LeanCloud，见 https://valine.js.org/
valine:
  appId:
  appKey:
  path: window.location.pathname
  placeholder:
  avatar: 'retro'
  meta: ['nick', 'mail', 'link']
  requiredFields: []
  pageSize: 10
  lang: 'zh-CN'
  highlight: false
  recordIP: false
  serverURLs: ''
  emojiCDN:
  emojiMaps:
  enableQQ: false

# Waline，从 Valine 衍生，需自建服务端，见 https://waline.js.org/
waline:
  serverURL: ''
  path: window.location.pathname
  meta: ['nick', 'mail', 'link']
  requiredMeta: ['nick']
  lang: 'zh-CN'
  emoji: ['https://cdn.jsdelivr.net/gh/walinejs/emojis/weibo']
  dark: 'html[data-user-color-scheme="dark"]'
  wordLimit: 0
  pageSize: 10

# 畅言 Changyan，第三方服务，见 http://changyan.kuaizhan.com
changyan:
  appid: ''
  appkey: ''

# 来必力 Livere，第三方服务，见 https://www.livere.com
livere:
  uid: ''

# Remark42，需自托管服务端，见 https://remark42.com
remark42:
  host:
  site_id:
  max_shown_comments: 10
  locale: zh
  components: ['embed']

# Twikoo，支持腾讯云、Vercel、Railway 等多种部署方式，见 https://twikoo.js.org
twikoo:
  envId:
  region: ap-shanghai
  path: window.location.pathname

# Cusdis，第三方或自托管服务，见 https://cusdis.com
cusdis:
  host:
  app_id:
  lang: zh-cn

# Giscus，基于 GitHub Discussions，类似 Utterances，见 https://giscus.app/
giscus:
  repo:
  repo-id:
  category:
  category-id:
  theme-light: light
  theme-dark: dark
  mapping: pathname
  reactions-enabled: 1
  emit-metadata: 0
  input-position: top
  lang: zh-CN

# Discuss，多平台、多数据库、自托管的免费开源评论系统，见 https://discuss.js.org
discuss:
  serverURLs:
  path: window.location.pathname


# ==========================================================
# 归档页
# ==========================================================

archive:
  banner_img: /img/banner.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.3


# ==========================================================
# 分类页
# ==========================================================

category:
  enable: true
  banner_img: /img/banner.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.3

  # 分类排序字段，减号开头为倒序，可选：length | name
  order_by: "-length"

  # 折叠深度，0 全部折叠；大于 0 且有子分类时默认展开
  collapse_depth: 0

  # 文章排序字段，减号开头为倒序
  post_order_by: "-date"

  # 单个分类折叠展示的文章数上限，超出显示 More，0 不限制
  post_limit: 10


